<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Quiz Yönetimi</title>
</head>
<body>
    <h1>Quiz Yönetimi</h1>

    <div class="quiz-container">
        {% for q in quizler %}
        <div class="quiz-card" style="border: 1px solid #ccc; margin: 10px; padding: 15px;">
            <h3>{{ q.baslik }}</h3>
            <a href="{{ url_for('quiz_sonuclari', quiz_id=q.id) }}">Sonuçları Gör</a>
        </div>
        {% else %}
            <p>Henüz kayıtlı quiz yok.</p>
        {% endfor %}
    </div>

    <hr>

    <h2>Sistemdeki Sorular</h2>
    <div class="soru-container">
        {% if sorular %}
            {% for s in sorular %}
            <div class="soru-card" style="border-bottom: 1px dashed #999; margin: 5px; padding: 5px;">
                <p><strong>Quiz ID: {{ s.quiz_id }}</strong> - {{ s.soru_metni }}</p>
            </div>
            {% endfor %}
        {% else %}
            <p>Henüz soru eklenmemiş.</p>
        {% endif %}
    </div>
</body>
</html>
