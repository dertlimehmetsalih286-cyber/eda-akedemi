{% extends "base.html" %}
{% block content %}
<h1>🧠 Quiz Oluştur</h1>
<div style="background:white; padding:20px; border-radius:12px;">
    <input type="text" id="quizBaslik" placeholder="Quiz Başlığı">
    <div id="soruAlani"></div>
    <button onclick="soruEkle()">+ Soru Ekle</button>
    <button onclick="quizKaydet()" style="background:green; color:white;">Quiz'i Yayınla</button>
</div>

<script>
    function soruEkle() {
        let div = document.createElement('div');
        div.innerHTML = `
            <input type="text" placeholder="Soru metni" class="soruMetni">
            <div class="siklar"></div>
            <button onclick="sikEkle(this)">+ Şık Ekle</button>
        `;
        document.getElementById('soruAlani').appendChild(div);
    }
    function sikEkle(btn) {
        let input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Şık metni';
        btn.previousElementSibling.appendChild(input);
    }
</script>
{% endblock %}
