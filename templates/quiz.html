<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eda Akademi - Quiz Yönetimi</title>
    </head>
<body>
    <main class="main-content">
        <h1>Quiz Yönetimi</h1>
        <div class="quiz-grid">
            {% for q in quizler %}
            <div class="quiz-card" style="border:1px solid #ddd; padding:20px; margin:10px; border-radius:10px;">
                <h2>{{ q.baslik if q.baslik else 'İsimsiz Quiz' }}</h2>
                
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button onclick="soruEkle('{{ q.id }}')" class="btn-purple">+ Soru Ekle</button>
                    <a href="/quiz_sonuclari/{{ q.id }}" style="background:#10b981; color:white; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:bold;">Çözenler</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
