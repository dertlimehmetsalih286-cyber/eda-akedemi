{% extends "base.html" %}
{% block content %}
<div style="display:flex; justify-content:space-between;">
    <h1>🧠 Quiz Yönetimi</h1>
    <button onclick="document.getElementById('qm').style.display='block'" style="background:#7c3aed; color:white; border:none; padding:10px; border-radius:8px;">+ Yeni Quiz</button>
</div>
<div id="qm" class="modal">
    <h3>Quiz Oluştur</h3>
    <input type="text" placeholder="Quiz Başlığı" style="width:100%; margin:5px 0;">
    <select><option>LGS</option><option>YKS</option></select>
    <button onclick="document.getElementById('qm').style.display='none'">Oluştur</button>
</div>
{% endblock %}
