<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eda Akademi - Giriş</title>
    <style>
        /* Genel Ayarlar ve Arka Plan */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f5f7; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }

        /* Tepe Logo Alanı */
        .logo-container { background-color: #7c3aed; width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
        .logo-container svg { width: 32px; height: 32px; fill: white; }

        /* Başlıklar */
        h1 { color: #111827; font-size: 28px; margin-bottom: 8px; font-weight: 700; }
        .subtitle { color: #6b7280; font-size: 15px; margin-bottom: 30px; }

        /* Ana Beyaz Kart */
        .login-card { background-color: white; width: 100%; max-width: 400px; border-radius: 16px; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); border: 1px solid #e5e7eb; }

        /* Form Elemanları */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #111827; margin-bottom: 8px; }
        .form-group .form-hint { font-size: 13px; color: #6b7280; margin-bottom: 25px; display: block; padding-bottom: 10px; border-bottom: 1px solid #e5e7eb; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; color: #374151; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1); }

        /* Giriş Butonu */
        .submit-btn { width: 100%; background-color: #7c3aed; color: white; border: none; border-radius: 8px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        .submit-btn:hover { background-color: #6d28d9; }
    </style>
</head>
<body>

    <div class="logo-container">
        <svg viewBox="0 0 24 24">
            <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2.81-1.53L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72l5 2.73 5-2.73v3.72z"/>
        </svg>
    </div>

    <h1>Eda Akademi'ye Hoşgeldiniz</h1>
    <p class="subtitle">Dijital sınıfınıza giriş yapın</p>

    <div class="login-card">
        <div class="form-group">
            <label>Giriş Yap</label>
            <span class="form-hint">Sisteme erişmek için bilgilerinizi girin</span>
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" name="username" placeholder="Kullanıcı adınız..." required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" name="password" placeholder="Şifreniz..." required>
            </div>
            
            <button type="submit" class="submit-btn">Giriş Yap</button>
        </form>
    </div>

</body>
</html>
