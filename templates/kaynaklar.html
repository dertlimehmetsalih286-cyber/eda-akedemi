{% extends "base.html" %}
{% block content %}
<div style="display:flex; justify-content:space-between;">
    <h1>📚 Kaynak Yönetimi</h1>
    <button onclick="document.getElementById('km').style.display='block'" style="background:#7c3aed; color:white; border:none; padding:10px; border-radius:8px;">+ Kaynak Ekle</button>
</div>
<div id="km" class="modal">
    <h3>Yeni Kaynak</h3>
    <input type="text" placeholder="Başlık" style="width:100%; margin:5px 0;">
    <select><option>Link</option><option>Dosya</option></select>
    <input type="text" placeholder="https://" style="width:100%; margin:5px 0;">
    <button onclick="document.getElementById('km').style.display='none'">Kaynak Ekle</button>
</div>
{% endblock %}
