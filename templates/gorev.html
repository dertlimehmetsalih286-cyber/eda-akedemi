<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eda Akademi - Görev Yönetimi</title>
    <style>
        /* Standart Eda Akademi CSS'i */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; min-height: 100vh; background-color: #f8f9fc; }
        .sidebar { width: 260px; background-color: white; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; padding: 20px 0; position: fixed; height: 100vh; top: 0; left: 0; z-index: 1000; }
        .logo-container { display: flex; align-items: center; padding: 0 20px 30px 20px; font-size: 22px; font-weight: bold; color: #111827; }
        .logo-icon { background-color: #7c3aed; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 15px; }
        .logo-icon svg { width: 24px; height: 24px; fill: white; }
        .nav-links { list-style: none; flex-grow: 1; }
        .nav-item { padding: 0 15px; margin-bottom: 5px; }
        .nav-link { display: flex; align-items: center; padding: 12px 20px; text-decoration: none; color: #4b5563; font-weight: 500; border-radius: 8px; transition: all 0.2s; }
        .nav-link.active { background-color: #7c3aed; color: white; }
        .nav-icon { margin-right: 15px; font-size: 18px; width: 24px; text-align: center; }
        
        .main-content { margin-left: 260px; padding: 40px; width: calc(100% - 260px); max-width: 1000px; }
        .btn-purple { background: #7c3aed; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-container">
            <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2.81-1.53L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72l5 2.73 5-2.73v3.72z"/></svg></div>
            Eda Akademi
        </div>
        <ul class="nav-links">
            <li class="nav-item"><a href="/ogretmen" class="nav-link"><span class="nav-icon">⊞</span> Dashboard</a></li>
            <li class="nav-item"><a href="/takvim" class="nav-link"><span class="nav-icon">📅</span> Takvim</a></li>
            <li class="nav-item"><a href="/gorev" class="nav-link active"><span class="nav-icon">☑️</span> Görev Yönetimi</a></li>
            <li class="nav-item"><a href="/quiz" class="nav-link"><span class="nav-icon">🧠</span> Quiz Yönetimi</a></li>
            <li class="nav-item"><a href="/kaynaklar" class="nav-link"><span class="nav-icon">📚</span> Kaynaklar</a></li>
            <li class="nav-item"><a href="/ogrenciler" class="nav-link"><span class="nav-icon">👥</span> Öğrenciler</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1 style="color:#111827;">Görev Yönetimi</h1>
            <button class="btn-purple" onclick="document.getElementById('gorevModal').style.display='block'">+ Yeni Görev</button>
        </div>

        <div id="gorevModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999;">
            <div style="background:white; max-width:500px; margin:50px auto; padding:30px; border-radius:16px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                    <h2>Yeni Görev</h2>
                    <span onclick="document.getElementById('gorevModal').style.display='none'" style="cursor:pointer; font-size:20px;">&times;</span>
                </div>
                
                <form action="/add-task" method="POST">
                    <div class="form-group">
                        <label>Sınav Türü</label>
                        <select name="sinav_turu" class="form-control">
                            <option value="LGS">LGS</option>
                            <option value="YKS">YKS</option>
                            <option value="Ara Sınıf">Ara Sınıf</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Ders</label>
                        <select name="ders" class="form-control">
                            <option value="TYT Türkçe">TYT Türkçe</option>
                            <option value="TYT Matematik">TYT Matematik</option>
                            <option value="TYT Tarih">TYT Tarih</option>
                            <option value="AYT Matematik">AYT Matematik</option>
                            <option value="AYT Tarih">AYT Tarih</option>
                            <option value="AYT Coğrafya">AYT Coğrafya</option>
                            <option value="Fizik">Fizik</option>
                            <option value="Kimya">Kimya</option>
                            <option value="Biyoloji">Biyoloji</option>
                            <option value="Fen Bilimleri">Fen Bilimleri</option>
                            <option value="Sosyal Bilgiler">Sosyal Bilgiler</option>
                            <option value="Tarih">Tarih</option>
                            <option value="Coğrafya">Coğrafya</option>
                            <option value="Felsefe">Felsefe</option>
                            <option value="Din Kültürü">Din Kültürü</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Başlık</label>
                        <input type="text" name="baslik" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Son Tarih</label>
                        <input type="date" name="son_tarih" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label>Öncelik</label>
                        <select name="oncelik" class="form-control">
                            <option value="Yüksek">Yüksek</option>
                            <option value="Orta">Orta</option>
                            <option value="Düşük">Düşük</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-purple" style="width:100%; margin-top:10px;">Görev Ekle</button>
                </form>
            </div>
        </div>

        <div style="background:white; padding:30px; border-radius:16px; border:1px solid #e5e7eb;">
            <p style="color:gray;">Burada eklenen görevler listelenecek...</p>
        </div>
    </main>
</body>
</html>
