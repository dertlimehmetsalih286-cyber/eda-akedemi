{% extends "base.html" %}
{% block content %}
<div style="display:flex; justify-content:space-between;">
    <h1>Görev Yönetimi</h1>
    <button onclick="document.getElementById('gm').style.display='block'" style="background:#7c3aed; color:white; border:none; padding:10px; border-radius:8px;">+ Görev Ekle</button>
</div>
<div id="gm" class="modal">
    <h3>Yeni Görev</h3>
    <select><option>LGS</option><option>YKS</option></select>
    <select><option>Türkçe</option><option>Matematik</option><option>Fen</option><option>Sosyal Bilgiler</option></select>
    <textarea placeholder="Açıklama giriniz..." style="width:100%; height:60px;"></textarea>
    <input type="date" style="width:100%;">
    <button onclick="document.getElementById('gm').style.display='none'">Görev Ekle</button>
</div>
{% endblock %}
