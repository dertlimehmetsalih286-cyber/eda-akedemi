{% extends "base.html" %}
{% block content %}
<div style="display:flex; justify-content:space-between; margin-bottom:20px;">
    <h1>📅 Takvim</h1>
    <button onclick="document.getElementById('m').style.display='block'" style="background:#7c3aed; color:white; border:none; padding:10px 20px; border-radius:8px;">+ Etkinlik Ekle</button>
</div>
<div id='calendar' style="background:white; padding:20px; border-radius:12px;"></div>
<div id="m" class="modal">
    <h3>Yeni Etkinlik</h3>
    <input type="text" placeholder="Metin giriniz..." style="width:100%; padding:8px; margin:10px 0;">
    <button onclick="document.getElementById('m').style.display='none'">Kaydet</button>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var c = new FullCalendar.Calendar(document.getElementById('calendar'), { initialView: 'dayGridMonth', locale: 'tr' });
        c.render();
    });
</script>
{% endblock %}
