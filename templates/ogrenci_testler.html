<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Eda Akademi - Akıllı Testler</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { display:flex; background:#f8f9fc; min-height:100vh; }
        
        .sidebar { width:260px; background:white; border-right:1px solid #e5e7eb; position:fixed; height:100vh; z-index:1000; padding:20px; }
        .logo-container { font-weight:bold; font-size:22px; margin-bottom:30px; display:flex; align-items:center; gap:10px; }
        .nav-link { display:block; padding:12px; text-decoration:none; color:#4b5563; font-weight:500; border-radius:8px; margin-bottom:5px; }
        .nav-link.active { background:#7c3aed; color:white; }
        
        .main-content { margin-left:260px; padding:40px; width:calc(100% - 260px); }
        
        .quiz-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(350px, 1fr)); gap:20px; }
        .quiz-card { background:white; padding:25px; border-radius:16px; border:1px solid #e5e7eb; }
        
        .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; padding:50px; display:none; overflow-y:auto; }
        .progress-bar { height:8px; background:#e5e7eb; border-radius:4px; margin-bottom:30px; }
        .progress-fill { height:100%; background:#7c3aed; border-radius:4px; width:0%; transition:0.3s; }
        .sik { display:block; padding:18px; margin:15px 0; border:2px solid #e5e7eb; border-radius:12px; cursor:pointer; font-weight:500; }
        .sik:hover { border-color:#7c3aed; }
        .btn-purple { background:#7c3aed; color:white; border:none; padding:15px 30px; border-radius:12px; font-size:16px; cursor:pointer; width:100%; font-weight:bold;}
        .btn-purple:disabled { background:#9ca3af; cursor:not-allowed; }
        
        .sonuc-karti { background:#f9fafb; padding:20px; border-radius:12px; margin:15px 0; border:1px solid #e5e7eb; }
        .dogru-cik { background:#dcfce7; border-color:#22c55e; }
        .yanlis-cik { background:#fee2e2; border-color:#ef4444; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo-container">Eda Akademi</div>
        <nav>
            <a href="/ogrenci" class="nav-link">Dashboard</a>
            <a href="/ogrenci_takvim" class="nav-link">Takvim</a>
            <a href="/ogrenci_gorevler" class="nav-link">Görevler</a>
            <a href="/ogrenci_testler" class="nav-link active">Akıllı Testler</a>
            <a href="/ogrenci_kaynaklar" class="nav-link">Kaynaklar</a>
            <a href="/ogrenci_siralama" class="nav-link">Sıralama</a>
        </nav>
        <div style="margin-top:auto; padding-top:20px;"><a href="/logout" style="color:red; text-decoration:none;">Çıkış Yap</a></div>
    </aside>

    <main class="main-content">
        <h1 class="page-title">Akıllı Testler</h1>
        <p class="page-subtitle" style="margin-bottom:30px; color:gray;">Öğretmenin hazırladığı quiz'leri çöz, anında puan kazan.</p>
        
        <div class="quiz-grid">
            {% for q in quizler %}
            <div class="quiz-card">
                <h2>{{ q.baslik }}</h2>
                <p style="color:gray; font-size:14px; margin:10px 0;">{{ q.aciklama }}</p>
                <button id="btn-{{ q.id }}" class="btn-purple" onclick="sinaviBaslat('{{ q.id }}')">Teste Başla</button>
            </div>
            {% endfor %}
        </div>
    </main>

    <div id="sinav-alani" class="modal"></div>

    <script>
        const tumSorular = {{ sorular | tojson | safe }};
        let aktifSorular = [], index = 0, skor = 0, cevaplar = [];
        let aktifQuizId = "";

        // ÖĞRENCİNİN HAFIZASI: Daha önce çözdüğü testleri hatırla
        const ogrenciHafizasi = "cozulmusTestler_{{ session.isim }}";
        let cozulenTestler = JSON.parse(localStorage.getItem(ogrenciHafizasi)) || [];

        // Sayfa açılınca, çözülmüş testlerin butonunu gri yap ve tıkalamayı kapat
        document.addEventListener("DOMContentLoaded", () => {
            cozulenTestler.forEach(qId => {
                let btn = document.getElementById('btn-' + qId);
                if(btn) {
                    btn.innerText = "✔ Çözüldü";
                    btn.disabled = true;
                }
            });
        });

        function sinaviBaslat(qId) {
            aktifQuizId = qId;
            aktifSorular = tumSorular.filter(s => s.quiz_id === qId);
            
            if(aktifSorular.length === 0) {
                alert("Bu testte henüz soru yok.");
                return;
            }
            
            index = 0; skor = 0; cevaplar = [];
            soruEkraniCiz();
            document.getElementById('sinav-alani').style.display = 'block';
        }

        function soruEkraniCiz() {
            let s = aktifSorular[index];
            let ilerleme = (index / aktifSorular.length) * 100;
            document.getElementById('sinav-alani').innerHTML = `
                <div style="max-width:700px; margin:auto; background:white; padding:40px; border-radius:16px; border:1px solid #e5e7eb;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>Soru ${index+1}/${aktifSorular.length}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${ilerleme}%"></div></div>
                    <h2 style="margin-bottom:30px;">${s.soru_metni}</h2>
                    ${['A','B','C','D'].map(h => `<div class="sik" onclick="cevapVer('${h}')"><b>${h})</b> ${s[h.toLowerCase()]}</div>`).join('')}
                </div>`;
        }

        function cevapVer(secim) {
            let s = aktifSorular[index];
            cevaplar.push({soru: s, secim: secim});
            if(secim === s.dogru) skor++;
            index++;
            if(index < aktifSorular.length) soruEkraniCiz(); else sonucGoster();
        }

        function sonucGoster() {
            let kazanilanPuan = skor * 10;
            
            // EĞER İLK KEZ ÇÖZÜYORSA VE PUAN KAZANDIYSA SİSTEME GÖNDER
            if(kazanilanPuan > 0 && !cozulenTestler.includes(aktifQuizId)) {
                
                // Arka planda Firebase'i güncellemesi için sinyal yolla
                fetch('/puan_ekle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ puan: kazanilanPuan })
                });

                // Testi tekrar çözememesi için hafızaya kaydet
                cozulenTestler.push(aktifQuizId);
                localStorage.setItem(ogrenciHafizasi, JSON.stringify(cozulenTestler));
            }

            let html = `<div style="max-width:600px; margin:auto; text-align:center;">
                        <h1>Test Bitti!</h1>
                        <div style="font-size:50px; font-weight:bold; margin:20px; color:#7c3aed;">%${(skor/aktifSorular.length*100).toFixed(0)}</div>
                        <p style="margin-bottom:20px;">${skor}/${aktifSorular.length} doğru yaptın.</p>
                        <button class="btn-purple" style="margin-bottom:30px;">+${kazanilanPuan} Puan kazandın! 🎉</button>
                        <h3 style="text-align:left;">CEVAPLAR</h3>`;
            
            cevaplar.forEach((c, i) => {
                let durum = c.secim === c.soru.dogru ? 'dogru-cik' : 'yanlis-cik';
                html += `<div class="sonuc-karti ${durum}" style="text-align:left;">
                            <p><b>${i+1}.</b> ${c.soru.soru_metni}</p>
                            <p>Senin Cevabın: ${c.secim} | Doğru Cevap: ${c.soru.dogru}</p>
                            <p style="font-size:13px; margin-top:5px; color:gray;"><i>Çözüm: ${c.soru.cozum}</i></p>
                        </div>`;
            });
            html += `<button class="btn-purple" style="margin-top:20px;" onclick="location.reload()">Panele Dön</button></div>`;
            document.getElementById('sinav-alani').innerHTML = html;
        }
    </script>
</body>
</html>
